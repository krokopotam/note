# note.wincyj.pl -> 127.0.0.1:8120 (serwis systemd: note.wincyj.pl.service)
#
# Plik WYŁĄCZNIE nowy - nie nadpisuje żadnej istniejącej konfiguracji.
# limit_req_zone definiujemy tutaj, w tym samym pliku: sites-enabled i tak jest
# łączony w kontekście http, więc /etc/nginx/nginx.conf zostaje nietknięty.
limit_req_zone $binary_remote_addr zone=note_rate:10m rate=20r/s;

# Rejestracja i logowanie są otwarte dla każdego (konta robi aplikacja, nie nginx),
# więc zgadowanie hasła ma być drogie: 5 prób na minutę z adresu.
limit_req_zone $binary_remote_addr zone=note_auth:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name note.wincyj.pl;

    # Odnowienie certyfikatu nie może się potknąć o żadną bramkę.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name note.wincyj.pl;

    ssl_certificate     /etc/letsencrypt/live/note.wincyj.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/note.wincyj.pl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    server_tokens off;

    access_log /var/log/nginx/note.access.log;
    error_log  /var/log/nginx/note.error.log warn;

    # Świadomie BEZ auth_basic: od chwili, gdy każdy może założyć konto w
    # aplikacji, hasło nginx-a stałoby przed logowaniem i uniemożliwiłoby
    # rejestrację. Jedyna bramka to sesja aplikacji (ciasteczko HttpOnly).

    # kiedy backend nie odpowiada, człowiek ma zobaczyć powód, nie goły 502
    error_page 502 503 504 = @backend_down;
    location @backend_down {
        default_type text/plain;
        charset utf-8;
        return 503 "Note chwilowo niedostępne (serwis note.wincyj.pl.service nie odpowiada).\n";
    }

    # Logowanie/rejestracja: osobny, ciasny limit.
    location /api/auth/ {
        limit_req zone=note_auth burst=5 nodelay;

        proxy_pass http://127.0.0.1:8120;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location / {
        limit_req zone=note_rate burst=20 nodelay;

        proxy_pass http://127.0.0.1:8120;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Aplikacja jest lekka (krótkie żądania JSON), ale bez tego nagłówka
        # nginx buforuje odpowiedź i interfejs sprawiałby wrażenie cięć.
        proxy_buffering off;
    }
}
