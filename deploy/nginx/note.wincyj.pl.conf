# note.wincyj.pl -> 127.0.0.1:8120 (serwis systemd: note.wincyj.pl.service)
#
# Plik WYŁĄCZNIE nowy - nie nadpisuje żadnej istniejącej konfiguracji.
# limit_req_zone definiujemy tutaj, w tym samym pliku: sites-enabled i tak jest
# łączony w kontekście http, więc /etc/nginx/nginx.conf zostaje nietknięty.
limit_req_zone $binary_remote_addr zone=note_rate:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name note.wincyj.pl;

    # Odnowienie certyfikatu nie może się potknąć o basic auth.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name note.wincyj.pl;

    ssl_certificate     /etc/letsencrypt/live/note.wincyj.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/note.wincyj.pl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    server_tokens off;

    access_log /var/log/nginx/note.access.log;
    error_log  /var/log/nginx/note.error.log;

    # Dostęp testowy jak w pozostałych aplikacjach: użytkownik "test".
    # Hasło trzyma apache2-utils w /etc/nginx/.htpasswd-note (tworzy install.sh).
    auth_basic           "note";
    auth_basic_user_file /etc/nginx/.htpasswd-note;

    location / {
        limit_req zone=note_rate burst=20 nodelay;

        proxy_pass http://127.0.0.1:8120;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Aplikacja jest lekka (krótkie żądania JSON), ale bez tego nagłówka
        # nginx buforuje odpowiedź i interfejs sprawiałby wrażenie cięć.
        proxy_buffering off;
    }
}
