# note.wincyj.pl - TYLKO HTTP, etap wydawania certyfikatu.
#
# Instalowany pierwszy: dopóki letsencrypt nie wyda certu, nie ma czego wystawiać
# na 443. Domains defaultowy zwraca 444 na nieznaną nazwę, więc bez tego bloku
# ACME HTTP-01 by nie przeszedł.
server {
    listen 80;
    listen [::]:80;
    server_name note.wincyj.pl;

    # Webroot wspólny z pozostałymi aplikacjami na tym serwerze.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
